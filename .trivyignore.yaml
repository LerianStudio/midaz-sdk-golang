# Suppressions for the CI filesystem scan (pr-validation.yml passes this file
# to the shared security workflow).
#
# Every entry below lives in the oapi-codegen TOOL dependency chain: it is a
# `tool` directive dependency used only at development time to regenerate
# internal/genledger and internal/gentracer (make generate / the codegen-drift
# check). None of this code is imported by the shipped library, so none of it
# ever runs in a consumer's binary. Upgrading the chain (oapi-codegen v2.7.x +
# kin-openapi v0.144.x) changes the generated-code layout and is tracked as a
# follow-up: the structural scans in entities/ parse the generated files and
# must be taught the new layout before the regeneration can land.
vulnerabilities:
