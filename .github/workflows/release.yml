name: Release Pipeline

on:
  push:
    branches: [main, develop, hotfix/v*]
    paths-ignore:
      - '.gitignore'
      - '**/*.env'
      - '*.env'
      - '**/*.md'
      - '*.md'
      - '**/*.txt'
      - '*.txt'
      - '.github/**'
      - 'docs/**'
      - 'LICENSE*'
      - '.golangci.yml'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  pipeline:
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/release.yml@v1.57.0
    with:
      enable_changelog: ${{ github.ref == 'refs/heads/main' }}
      stable_releases_only: true
    secrets: inherit

  post-release-steps:
    name: 📦 Post Release Tasks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: pipeline
    if: needs.pipeline.outputs.new_release_published == 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.pipeline.outputs.new_release_git_tag }}
          fetch-depth: 0

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
          passphrase: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
          git_committer_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
          git_committer_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}
          git_config_global: true
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Clean repo (reset + clean)
        run: |
          git reset --hard
          git clean -fd

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
