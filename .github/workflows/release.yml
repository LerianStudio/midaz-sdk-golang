name: release

on:
  push:
    branches:
      - develop
      - main
      - hotfix/v*
    paths-ignore:
      - '.gitignore'
      - '**/*.env'
      - '*.env'
      - '**/*.md'
      - '*.md'
      - '**/*.txt'
      - '*.txt'
    tags-ignore:
      - '**'

permissions:
  contents: read
  packages: read

jobs:
  preflight:
    name: ✅ Release Preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.3"
          cache: true

      - name: Run local CI
        run: make ci

  # Publish release using the lerian-studio/github-actions-go-pipeline-template
  publish-release:
    needs: preflight
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      packages: read
    uses: LerianStudio/github-actions-go-pipeline-template/.github/workflows/release.yml@115fa7be4a3558bad100a8dc1a9341a45747e885 # main
    secrets:
      lerian_studio_push_bot_app_id: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_APP_ID }}
      lerian_studio_push_bot_private_key: ${{ secrets.LERIAN_STUDIO_MIDAZ_PUSH_BOT_PRIVATE_KEY }}
      lerian_ci_cd_user_gpg_key: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY }}
      lerian_ci_cd_user_gpg_key_password: ${{ secrets.LERIAN_CI_CD_USER_GPG_KEY_PASSWORD }}
      lerian_ci_cd_user_name: ${{ secrets.LERIAN_CI_CD_USER_NAME }}
      lerian_ci_cd_user_email: ${{ secrets.LERIAN_CI_CD_USER_EMAIL }}

  # Execute post steps after the release is published
  post-release-steps:
    name: 📦 Post Release Tasks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: publish-release
    permissions:
      id-token: write
      contents: write
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Clean repo (reset + clean)
        run: |
          git reset --hard
          git clean -fd

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ needs.publish-release.outputs.gpg_fingerprint }}

  # AI-powered changelog via the shared OpenRouter workflow (aligned with console-sdk).
  # Uses the org OPENROUTER_API_KEY through `secrets: inherit`; model openai/gpt-4o.
  # Only runs on stable releases from main (stable_releases_only).
  generate-changelog:
    name: 📝 Generate AI-powered Changelog
    needs: post-release-steps
    if: github.ref_name == 'main'
    permissions:
      contents: write # commit the generated CHANGELOG.md
      pull-requests: write # open the changelog PR
    uses: LerianStudio/github-actions-shared-workflows/.github/workflows/gptchangelog.yml@v1.43.1
    with:
      runner_type: blacksmith-4vcpu-ubuntu-2404
      stable_releases_only: true
    secrets: inherit
