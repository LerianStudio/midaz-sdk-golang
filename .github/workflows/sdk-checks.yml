name: SDK Checks

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'

permissions:
  contents: read

env:
  GO_VERSION: "1.26.3"

jobs:
  verify-sdk:
    name: Verify SDK
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify SDK
        run: make verify-sdk

  docs:
    name: Generate Docs
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate static documentation
        run: make godoc-static

      - name: Upload documentation
        uses: actions/upload-artifact@v7
        with:
          name: godoc
          path: docs/godoc/

  gosec-audit:
    name: Run Scheduled GoSec Audit
    runs-on: blacksmith-4vcpu-ubuntu-2404
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Gosec Audit Scanner
        run: make gosec-audit
