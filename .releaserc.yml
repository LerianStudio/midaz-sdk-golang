plugins:
  - path: "@semantic-release/commit-analyzer"
    preset: conventionalcommits

  - path: "@semantic-release/release-notes-generator"
    preset: conventionalcommits

  - path: "@semantic-release/github"

  # Bump the in-source SDK version before the release tag is created. This is
  # a library (goreleaser builds no binary), so `go get` compiles the tagged
  # source tree — the version consumers see is whatever pkg/version/version.go
  # holds at the tag.
  #
  # @semantic-release/git is NOT used here: the shared release.yml pipeline
  # only npm-installs @semantic-release/exec + conventional-changelog-
  # conventionalcommits (via extra_plugins) — semantic-release core itself
  # bundles commit-analyzer/release-notes-generator/github/npm, but NOT git.
  # Listing an uninstalled plugin here fails the run with "Cannot find
  # module". So the commit+push happens directly in this shell script
  # (reusing the git identity/GPG signing already configured earlier in the
  # job) instead of relying on that plugin. semantic-release's own tagging
  # runs after prepareCmd, on whatever HEAD is at that point — so the tag
  # lands on this bump commit once it's pushed.
  - path: "@semantic-release/exec"
    prepareCmd: |-
      sed -i -E 's/Version = "[^"]*"/Version = "${nextRelease.version}"/' pkg/version/version.go
      git add pkg/version/version.go
      git commit -m "chore(release): ${nextRelease.version} [skip ci]"
      git push origin HEAD:$(git rev-parse --abbrev-ref HEAD)

branches:
  - name: main
  - name: develop
    prerelease: beta
  - name: hotfix/*
    prerelease: false
    channel: false
