plugins:
  - path: "@semantic-release/commit-analyzer"
    preset: conventionalcommits
    parserOpts:
      noteKeywords:
        - "BREAKING CHANGE"
        - "BREAKING CHANGES"
    releaseRules:
      - type: feat
        release: minor
      - type: perf
        release: minor
      - type: build
        release: minor
      - type: chore
        release: patch
      - type: ci
        release: patch
      - type: test
        release: patch
      - type: fix
        release: patch # to hotfix scenarios
      - type: refactor
        release: minor
      - type: docs
        release: patch
      - breaking: true
        release: major
        
  # Bump the in-source SDK version before the release commit. This is a library
  # (goreleaser builds no binary), so `go get` compiles the tagged source tree —
  # the version consumers see is whatever pkg/version/version.go holds at the
  # tag. prepareCmd runs before @semantic-release/git so the rewrite lands in
  # the release commit.
  - path: "@semantic-release/exec"
    prepareCmd: |-
      sed -i -E 's/Version = "[^"]*"/Version = "${nextRelease.version}"/' pkg/version/version.go

  # Plugin to version the CHANGELOG.md and the bumped SDK version constant
  - path: "@semantic-release/git"
    assets:
      - CHANGELOG.md
      - pkg/version/version.go
    message: "chore(release): ${nextRelease.version}\n\nChangelog atualizado."

  # Plugin to publish the CHANGELOG.md as an asset in the GitHub release
  - path: "@semantic-release/github"
    assets:
      - path: CHANGELOG.md
        label: "Changelog"
    successComment: false
    failComment: false
    labels: []
  
  # Plugin to perform the backmerge between the 'main' and 'develop' branches
  - path: "@saithodev/semantic-release-backmerge"
    backmergeBranches:
      - from: main
        to: develop
    message: "chore(release): Preparations for next release [skip ci]"

branches:
  - name: main
  - name: develop
    prerelease: beta
  - name: hotfix/*
    prerelease: false
    channel: false