  /validations/{validation_id}/reservations:
    get:
      description: "Use this endpoint to read the holds the ledger's reserve placed on spending limits for the transaction this validation decided on, each with its state: RESERVED (held), CONFIRMED (the transaction committed and the amount counts as spent), RELEASED (the transaction was cancelled and the amount returned) or EXPIRED (nothing settled the hold before reservationExpiresAt and the amount was returned). The read takes no lock and changes nothing. A validation with no transaction, from POST /v1/validations or /v1/validations/rules-only, or whose transaction held nothing, answers 200 with an empty list. An unknown validation answers 404 (code 0432). A request a partner made, with its own credential or relayed as an application's actor, also answers 404 (code 0432), as for an unknown validation: a hold names a limit, a scope, a period and an amount, which sum to the limit's shared counter."
      operationId: listValidationReservations
      parameters:
        - description: Transaction Validation ID (UUID)
          in: path
          name: validation_id
          required: true
          schema:
            description: Transaction Validation ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationReservations"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid credentials. API-key mode (or a bearer token without sub) answers application/json; an Access Manager refusal under plugin auth answers application/problem+json.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: List the holds of a validation's transaction
      tags:
        - Validations
servers:
  - url: /v1
tags:
  - description: Validate transactions in real time against active rules and spending limits, and read the stored decisions.
    name: Validations
  - description: "Manage fraud rules: CEL expressions with scopes, and their DRAFT, ACTIVE and INACTIVE lifecycle."
    name: Rules
  - description: Manage spending limits, their lifecycle and their current usage.
    name: Limits
  - description: Read the hash-chained audit events and verify the integrity of the chain.
    name: Audit
  - description: "Read aggregate metrics over a time window: flagged traffic, headline metrics, busiest rules and validation volume."
    name: Dashboard
