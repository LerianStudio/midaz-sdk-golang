    post:
      description: "Use this endpoint to check a transaction against the active rules and the applicable spending limits in real time. Returns a decision (ALLOW, DENY, or REVIEW) along with details about which rules matched and the usage each limit would reach. A request a partner made, with its own credential or relayed as an application's actor, receives the same answer with an empty limitUsageDetails: a limit's scope and shared counters span other accounts. A DENY or REVIEW by the rules decides; an ALLOW is checked against each applicable limit, and an amount that would take a limit past its maximum answers DENY with reason limit_exceeded. It is a check: no limit counter moves and nothing is reserved; only the ledger's transaction reserve consumes a limit. A requestId already stored returns that stored verdict with 200 when the request body is the same (key order and whitespace do not matter), and 409 (code 0084) when the body differs in any field other than transactionTimestamp, which is ignored: use a new requestId for a different request. A requestId first stored through POST /v1/validations/rules-only also answers 409 (code 0084); a requestId stored before request fingerprints existed replays whatever the body."
      operationId: validateTransaction
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
          description: OK
        "201":
          description: New validation created
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid credentials. API-key mode (or a bearer token without sub) answers application/json; an Access Manager refusal under plugin auth answers application/problem+json.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The requestId is already stored for a request that differs in a field other than transactionTimestamp (a body differing only in transactionTimestamp replays; a requestId first stored through the other validate route also answers 409; a requestId stored before request fingerprints existed replays whatever the body)
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: The tenant's rule cache is not hydrated yet (code 0437); retry shortly
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
