components:
  schemas:
    AccountContext:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          type: object
        status:
          examples:
            - ACTIVE
          type: string
        type:
          examples:
            - deposit
          type: string
      required:
        - accountId
      type: object
    Actor:
      additionalProperties: false
      properties:
        actorType:
          examples:
            - user
          type: string
        id:
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        ipAddress:
          examples:
            - 203.0.113.42
          type: string
        name:
          examples:
            - Jane Doe
          type: string
        role:
          examples:
            - admin
          type: string
      required:
        - actorType
        - id
        - name
        - ipAddress
      type: object
    AssetAmount:
      additionalProperties: false
      properties:
        amount:
          examples:
            - "12500.00"
          type: string
        asset:
          examples:
            - USD
          type: string
      required:
        - asset
        - amount
      type: object
    AuditEvent:
      additionalProperties: false
      properties:
        action:
          examples:
            - VALIDATE
          type: string
        actor:
          $ref: "#/components/schemas/Actor"
        context:
          additionalProperties: {}
          type: object
        createdAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        eventId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        eventType:
          examples:
            - TRANSACTION_VALIDATED
          type: string
        hash:
          description: SHA-256 digest of this event's own fields. Events created before the audit linker hold the digest chained to their predecessor.
          examples:
            - a3f1e2b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2
          type: string
        metadata:
          additionalProperties: {}
          type: object
        previousHash:
          description: Hash of the preceding event. Set only on events created before the audit linker; newer events are chained in batches and carry none.
          examples:
            - b4e2f3a5c6d7e8f9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3
          type: string
        resourceId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        resourceType:
          examples:
            - transaction
          type: string
        result:
          examples:
            - ALLOW
          type: string
      required:
        - eventId
        - eventType
        - createdAt
        - action
        - result
        - resourceId
        - resourceType
        - actor
      type: object
    ControlEvaluation:
      additionalProperties: false
      properties:
        bindingId:
          description: Binding that decided the instruction; absent when it came from the fallback mode.
          type: string
        control:
          description: "Control evaluated: RULES or LIMITS."
          examples:
            - RULES
          type: string
        decidedBy:
          description: Rules (RULES control) or limits (LIMITS control) that produced the verdict.
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        effect:
          description: "This control's contribution: REFUSE when the instruction is ENFORCE and the verdict is DENY or REVIEW, PROCEED otherwise."
          examples:
            - REFUSE
          type: string
        instruction:
          description: "What the caller does with the verdict: ENFORCE, ADVISORY, AUDIT or OFF."
          examples:
            - ENFORCE
          type: string
        verdict:
          description: "What the control decided: ALLOW, DENY, REVIEW or NOT_EVALUATED."
          examples:
            - DENY
          type: string
      required:
        - control
        - verdict
        - instruction
        - decidedBy
        - effect
      type: object
    CreateLimitInput:
      additionalProperties: true
      properties:
        activeTimeEnd:
          examples:
            - "17:00"
          type: string
        activeTimeStart:
          examples:
            - "09:00"
          type: string
        asset:
          examples:
            - USD
          maxLength: 100
          minLength: 1
          type: string
        customEndDate:
          examples:
            - "2026-11-29T00:00:00Z"
          format: date-time
          type: string
        customStartDate:
          examples:
            - "2026-11-27T00:00:00Z"
          format: date-time
          type: string
        description:
          description: Limit description, at most 1000 characters.
          maxLength: 1000
          type: string
        limitType:
          enum:
            - DAILY
            - MONTHLY
            - PER_TRANSACTION
            - WEEKLY
            - CUSTOM
          examples:
            - DAILY
          type: string
        maxAmount:
          examples:
            - "1000.00"
          type: string
        name:
          description: Limit name, 1 to 255 characters.
          maxLength: 255
          minLength: 1
          type: string
        resetTime:
          examples:
            - "09:00"
          type: string
        scopes:
          items:
            $ref: "#/components/schemas/Scope"
          type: array
      required:
        - name
        - limitType
        - maxAmount
        - asset
        - scopes
      type: object
    CreateRuleInput:
      additionalProperties: true
      properties:
        action:
          enum:
            - ALLOW
            - DENY
            - REVIEW
          examples:
            - DENY
          type: string
        description:
          description: Rule description, at most 1000 characters.
          maxLength: 1000
          type: string
        expression:
          description: CEL expression, 1 to 5000 characters.
          maxLength: 5000
          minLength: 1
          type: string
        name:
          description: Rule name, 1 to 255 characters.
          maxLength: 255
          minLength: 1
          type: string
        scopes:
          items:
            $ref: "#/components/schemas/Scope"
          type: array
      required:
        - name
        - expression
        - action
      type: object
    DashboardFraudTypes:
      additionalProperties: false
      properties:
        totalFlagged:
          examples:
            - 4133
          format: int64
          type: integer
        types:
          items:
            $ref: "#/components/schemas/FraudTypeSlice"
          type:
            - array
            - "null"
        updatedAt:
          format: date-time
          type: string
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      required:
        - types
        - totalFlagged
        - windowStart
        - windowEnd
        - updatedAt
      type: object
    DashboardMetrics:
      additionalProperties: false
      properties:
        activeLimits:
          examples:
            - 12
          format: int64
          type: integer
        activeRules:
          examples:
            - 20
          format: int64
          type: integer
        allowed:
          examples:
            - 78037
          format: int64
          type: integer
        amountSaved:
          description: Blocked amount of the single asset in the window. Present only when exactly one asset carried blocked volume; absent otherwise. Read amountSavedByAsset for the general case.
          examples:
            - "12500.00"
          type: string
        amountSavedByAsset:
          items:
            $ref: "#/components/schemas/AssetAmount"
          type:
            - array
            - "null"
        approvalRate:
          examples:
            - 0.95
          format: double
          type: number
        asset:
          description: The single asset amountSaved is expressed in. Present only when exactly one asset carried blocked volume; absent otherwise.
          examples:
            - USD
          type: string
        avgProcessingTimeMs:
          examples:
            - 12.4
          format: double
          type: number
        fraudDetectionRate:
          examples:
            - 0.05
          format: double
          type: number
        fraudsBlocked:
          examples:
            - 4107
          format: int64
          type: integer
        manualReviewRate:
          examples:
            - 0.0125
          format: double
          type: number
        manualReviews:
          examples:
            - 1026
          format: int64
          type: integer
        transactionsProcessed:
          examples:
            - 82144
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      required:
        - transactionsProcessed
        - allowed
        - fraudsBlocked
        - manualReviews
        - approvalRate
        - fraudDetectionRate
        - manualReviewRate
        - amountSavedByAsset
        - avgProcessingTimeMs
        - activeRules
        - activeLimits
        - windowStart
        - windowEnd
        - updatedAt
      type: object
    DashboardTopRules:
      additionalProperties: false
      properties:
        rules:
          items:
            $ref: "#/components/schemas/TopRule"
          type:
            - array
            - "null"
        updatedAt:
          format: date-time
          type: string
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      required:
        - rules
        - windowStart
        - windowEnd
        - updatedAt
      type: object
    DashboardVolume:
      additionalProperties: false
      properties:
        points:
          items:
            $ref: "#/components/schemas/VolumePoint"
          type:
            - array
            - "null"
        updatedAt:
          format: date-time
          type: string
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      required:
        - points
        - windowStart
        - windowEnd
        - updatedAt
      type: object
    Error:
      additionalProperties: true
      properties:
        code:
          description: "Stable, machine-readable domain error code scoped to the emitting service (format: <SERVICE>-NNNN)."
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
        upstream:
          $ref: "#/components/schemas/Upstream"
          description: "RFC 9457 extension member: the error a proxied third-party provider reported. Absent unless the emitting service explicitly surfaced one."
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    FraudTypeSlice:
      additionalProperties: false
      properties:
        count:
          examples:
            - 1287
          format: int64
          type: integer
        percentage:
          examples:
            - 0.31
          format: double
          type: number
        total:
          examples:
            - 20536
          format: int64
          type: integer
        type:
          examples:
            - CARD
          type: string
      required:
        - type
        - count
        - percentage
        - total
      type: object
    HashChainVerificationResult:
      additionalProperties: false
      properties:
        firstInvalidId:
          examples:
            - 42
          format: int64
          type: integer
        isValid:
          examples:
            - true
          type: boolean
        message:
          examples:
            - hash chain intact
          type: string
        totalChecked:
          description: "Hash-chain rows verified for legacy events; chain links (at most 3: the event's link and its neighbours) for newer events."
          examples:
            - 1000
          format: int64
          type: integer
      required:
        - isValid
        - totalChecked
        - message
      type: object
    Limit:
      additionalProperties: false
      properties:
        activeTimeEnd:
          examples:
            - "17:00"
          type: string
        activeTimeStart:
          examples:
            - "09:00"
          type: string
        asset:
          examples:
            - USD
          type: string
        createdAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        customEndDate:
          examples:
            - "2021-12-31T23:59:59Z"
          format: date-time
          type: string
        customStartDate:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        deletedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        description:
          examples:
            - Caps daily USD outflows for retail accounts
          type: string
        limitId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        limitType:
          examples:
            - DAILY
          type: string
        maxAmount:
          examples:
            - "1000.00"
          type: string
        name:
          examples:
            - Daily USD spending cap
          maxLength: 255
          type: string
        resetAt:
          examples:
            - "2021-01-02T00:00:00Z"
          format: date-time
          type: string
        resetTime:
          examples:
            - "09:00"
          type: string
        scopes:
          items:
            $ref: "#/components/schemas/Scope"
          type:
            - array
            - "null"
        status:
          examples:
            - ACTIVE
          type: string
        updatedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
      required:
        - limitId
        - name
        - limitType
        - maxAmount
        - asset
        - scopes
        - status
        - createdAt
        - updatedAt
      type: object
    LimitUsageDetail:
      additionalProperties: false
      properties:
        attemptedAmount:
          examples:
            - "100.00"
          type: string
        currentUsage:
          examples:
            - "500.00"
          type: string
        exceeded:
          type: boolean
        limitAmount:
          examples:
            - "1000.00"
          type: string
        limitId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        period:
          examples:
            - DAILY
          type: string
        scope:
          examples:
            - account:00000000-0000-0000-0000-000000000000
          type: string
        skipReason:
          examples:
            - outside_time_window
          type: string
        skipped:
          type: boolean
      required:
        - limitId
        - limitAmount
        - scope
        - period
        - currentUsage
        - attemptedAmount
        - exceeded
      type: object
    ListAuditEventsResponse:
      additionalProperties: false
      properties:
        auditEvents:
          items:
            $ref: "#/components/schemas/AuditEvent"
          maxItems: 1000
          type:
            - array
            - "null"
        hasMore:
          examples:
            - true
          type: boolean
        nextCursor:
          examples:
            - eyJpZCI6IjAxOTI4In0=
          type: string
      required:
        - auditEvents
        - hasMore
      type: object
    ListLimitsResponse:
      additionalProperties: false
      properties:
        hasMore:
          examples:
            - true
          type: boolean
        limits:
          items:
            $ref: "#/components/schemas/Limit"
          type:
            - array
            - "null"
        nextCursor:
          examples:
            - eyJpZCI6IjAxOTI4In0=
          type: string
      required:
        - limits
        - hasMore
      type: object
    ListRulesResponse:
      additionalProperties: false
      properties:
        hasMore:
          examples:
            - true
          type: boolean
        nextCursor:
          examples:
            - eyJpZCI6IjAxOTI4In0=
          type: string
        rules:
          items:
            $ref: "#/components/schemas/Rule"
          type:
            - array
            - "null"
      required:
        - rules
        - hasMore
      type: object
    ListTransactionValidationsResponse:
      additionalProperties: false
      properties:
        hasMore:
          examples:
            - true
          type: boolean
        nextCursor:
          examples:
            - eyJpZCI6IjAxOTI4In0=
          type: string
        transactionValidations:
          items:
            $ref: "#/components/schemas/ValidationSummary"
          type:
            - array
            - "null"
      required:
        - transactionValidations
        - hasMore
      type: object
    MerchantContext:
      additionalProperties: false
      properties:
        category:
          examples:
            - "5411"
          type: string
        country:
          examples:
            - US
          type: string
        merchantId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          type: object
        name:
          examples:
            - Acme Store
          type: string
      required:
        - merchantId
      type: object
    PolicyEvaluation:
      additionalProperties: false
      properties:
        controls:
          items:
            $ref: "#/components/schemas/ControlEvaluation"
          type:
            - array
            - "null"
        policyId:
          description: Evaluated policy; empty for the active rules and limits evaluated as one.
          type: string
        revision:
          description: Revision of the evaluated policy; 0 for the active rules and limits evaluated as one.
          format: int32
          minimum: 0
          type: integer
      required:
        - policyId
        - revision
        - controls
      type: object
    PortfolioContext:
      additionalProperties: false
      properties:
        metadata:
          additionalProperties: {}
          type: object
        name:
          examples:
            - growth
          type: string
        portfolioId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
      required:
        - portfolioId
      type: object
    Reservation:
      additionalProperties: false
      properties:
        amount:
          description: Amount held against the limit, a decimal string in the transaction's asset.
          examples:
            - "500.00"
          minimum: 0
          type: string
        confirmedAt:
          description: When the ledger confirmed the transaction; absent until then.
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        limitId:
          format: uuid
          type: string
        periodKey:
          description: "Usage period of the bucket: yyyy-mm-dd (DAILY), yyyy-mm (MONTHLY), yyyy-Www (WEEKLY) or custom (CUSTOM)."
          type: string
        releasedAt:
          description: When the hold returned its amount, by release or expiry; absent otherwise. A hold confirmed after it expired carries both.
          format: date-time
          type: string
        reservationExpiresAt:
          description: When an unsettled hold expires and returns its amount.
          format: date-time
          type: string
        reservationId:
          format: uuid
          type: string
        scopeKey:
          description: "Usage bucket the hold sits in: the scope's ids as acct:, port:, seg: and merch: entries joined by |; empty for a limit scoped only by scheme or sub type."
          type: string
        status:
          description: "State of the hold: RESERVED (held), CONFIRMED (the transaction committed; the amount counts as spent), RELEASED (the transaction was cancelled; the amount was returned) or EXPIRED (nothing settled it before reservationExpiresAt; the amount was returned)."
          enum:
            - RESERVED
            - CONFIRMED
            - RELEASED
            - EXPIRED
          type: string
        transactionId:
          format: uuid
          type: string
      required:
        - reservationId
        - limitId
        - scopeKey
        - periodKey
        - amount
        - status
        - transactionId
        - reservationExpiresAt
        - createdAt
      type: object
    Rule:
      additionalProperties: false
      properties:
        action:
          examples:
            - DENY
          type: string
        activatedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        createdAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        deactivatedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        deletedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        description:
          examples:
            - Denies transactions over $1000 from checking accounts
          type: string
        expression:
          examples:
            - transaction.amount > 1000 && account.type == 'checking'
          type: string
        name:
          examples:
            - Block high-value checking transactions
          maxLength: 255
          type: string
        ruleId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        scopes:
          items:
            $ref: "#/components/schemas/Scope"
          type:
            - array
            - "null"
        status:
          examples:
            - ACTIVE
          type: string
        updatedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
      required:
        - ruleId
        - name
        - expression
        - action
        - scopes
        - status
        - createdAt
        - updatedAt
      type: object
    Scope:
      additionalProperties: false
      properties:
        accountId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        merchantId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        portfolioId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        scheme:
          examples:
            - PIX
          maxLength: 50
          type: string
        segmentId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        subType:
          description: "Sub type the scope is restricted to (optional): 1 to 50 bytes after trimming and lower-casing; a blank value is refused. Matched case-insensitively."
          examples:
            - purchase
          maxLength: 50
          type: string
        transactionType:
          examples:
            - PIX
          maxLength: 50
          type: string
      type: object
    SegmentContext:
      additionalProperties: false
      properties:
        metadata:
          additionalProperties: {}
          type: object
        name:
          examples:
            - retail
          type: string
        segmentId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
      required:
        - segmentId
      type: object
    TopRule:
      additionalProperties: false
      properties:
        avgProcessingMs:
          examples:
            - 41.2
          format: double
          type: number
        detectionRate:
          examples:
            - 0.063
          format: double
          type: number
        executions:
          examples:
            - 20536
          format: int64
          type: integer
        matches:
          examples:
            - 1287
          format: int64
          type: integer
        name:
          examples:
            - high-value-wire
          type: string
        productType:
          examples:
            - WIRE
          type: string
      required:
        - name
        - matches
        - executions
        - detectionRate
        - avgProcessingMs
      type: object
    TransactionValidation:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountContext"
        amount:
          examples:
            - "100.00"
          type: string
        asset:
          examples:
            - USD
          type: string
        createdAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        decision:
          examples:
            - ALLOW
          type: string
        evaluatedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        instructionSource:
          description: "Where the instructions came from: BINDING, or FALLBACK when at least one control used the caller's fallback mode. Absent for a record a decision did not write."
          examples:
            - FALLBACK
          type: string
        ledgerId:
          description: Midaz ledger of the transaction this reservation decided on. Absent for a validation or rules-only request, and for records written before the ledger sent it.
          format: uuid
          type: string
        limitUsageDetails:
          description: Usage of every limit checked. Empty for a request a partner made.
          items:
            $ref: "#/components/schemas/LimitUsageDetail"
          type:
            - array
            - "null"
        matchedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        merchant:
          $ref: "#/components/schemas/MerchantContext"
        metadata:
          additionalProperties: {}
          type: object
        organizationId:
          description: Midaz organization of the transaction this reservation decided on. Absent for a validation or rules-only request, and for records written before the ledger sent it.
          format: uuid
          type: string
        outcome:
          description: "Effect the caller obeyed: REFUSE or PROCEED. Absent for a record a decision did not write."
          examples:
            - REFUSE
          type: string
        policies:
          description: Evaluation of every policy, per control. Absent for a record a decision did not write and for a request a partner made.
          items:
            $ref: "#/components/schemas/PolicyEvaluation"
          type:
            - array
            - "null"
        portfolio:
          $ref: "#/components/schemas/PortfolioContext"
        processingTimeMs:
          examples:
            - 12.5
          format: double
          type: number
        reason:
          examples:
            - Transaction denied by rule 'Block high-value checking transactions'
          type: string
        requestId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        scheme:
          examples:
            - PIX
          maxLength: 50
          type: string
        segment:
          $ref: "#/components/schemas/SegmentContext"
        sources:
          description: Outcome per source of a reserve with more than one source. Absent for any other record and for a request a partner made.
          items:
            $ref: "#/components/schemas/ValidationSource"
          type:
            - array
            - "null"
        subType:
          examples:
            - purchase
          maxLength: 50
          type: string
        totalRulesLoaded:
          examples:
            - 42
          format: int64
          type: integer
        transactionId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        transactionTimestamp:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        transactionType:
          examples:
            - PIX
          maxLength: 50
          type: string
        truncated:
          examples:
            - false
          type: boolean
        validationId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
      required:
        - validationId
        - requestId
        - transactionType
        - scheme
        - amount
        - asset
        - transactionTimestamp
        - account
        - limitUsageDetails
        - processingTimeMs
        - createdAt
        - decision
        - matchedRuleIds
        - evaluatedRuleIds
        - reason
        - totalRulesLoaded
        - truncated
      type: object
    UnauthorizedError:
      additionalProperties: false
      properties:
        code:
          description: Stable error code.
          type: string
        message:
          description: Human-readable explanation.
          type: string
        title:
          description: Short summary of the error.
          type: string
      required:
        - code
        - title
        - message
      type: object
    UpdateLimitInput:
      additionalProperties: true
      properties:
        activeTimeEnd:
          description: End of the daily time window (HH:MM). Send activeTimeStart and activeTimeEnd both as null to remove the window.
          examples:
            - "17:00"
          type:
            - string
            - "null"
        activeTimeStart:
          description: Start of the daily time window (HH:MM). Send activeTimeStart and activeTimeEnd both as null to remove the window.
          examples:
            - "09:00"
          type:
            - string
            - "null"
        customEndDate:
          examples:
            - "2026-11-29T00:00:00Z"
          format: date-time
          type: string
        customStartDate:
          examples:
            - "2026-11-27T00:00:00Z"
          format: date-time
          type: string
        description:
          description: Limit description, at most 1000 characters.
          maxLength: 1000
          type: string
        maxAmount:
          examples:
            - "1000.00"
          type: string
        name:
          description: Limit name, 1 to 255 characters.
          maxLength: 255
          minLength: 1
          type: string
        scopes:
          items:
            $ref: "#/components/schemas/Scope"
          type: array
      type: object
    UpdateRuleInput:
      additionalProperties: true
      properties:
        action:
          enum:
            - ALLOW
            - DENY
            - REVIEW
          examples:
            - DENY
          type: string
        description:
          description: Rule description, at most 1000 characters.
          maxLength: 1000
          type: string
        expression:
          description: CEL expression, 1 to 5000 characters. Editable only while the rule is in DRAFT status.
          maxLength: 5000
          minLength: 1
          type: string
        name:
          description: Rule name, 1 to 255 characters.
          maxLength: 255
          minLength: 1
          type: string
        scopes:
          items:
            $ref: "#/components/schemas/Scope"
          type: array
      type: object
    Upstream:
      additionalProperties: false
      properties:
        code:
          description: The upstream provider's own error code, verbatim.
          examples:
            - E4001
          type: string
        message:
          description: The upstream provider's own error message, verbatim (bounded, never its raw response body).
          examples:
            - account not found at provider
          type: string
      type: object
    UsageSnapshot:
      additionalProperties: false
      properties:
        currentUsage:
          examples:
            - "500.00"
          type: string
        limitAmount:
          examples:
            - "1000.00"
          type: string
        limitId:
          format: uuid
          type: string
        nearLimit:
          examples:
            - false
          type: boolean
        resetAt:
          format: date-time
          type: string
        utilizationPercent:
          examples:
            - 50
          format: double
          type: number
      required:
        - limitId
        - currentUsage
        - limitAmount
        - utilizationPercent
        - nearLimit
      type: object
    ValidationRequest:
      additionalProperties: true
      properties:
        account:
          $ref: "#/components/schemas/AccountContext"
        amount:
          examples:
            - "100.00"
          type: string
        asset:
          examples:
            - USD
          type: string
        merchant:
          $ref: "#/components/schemas/MerchantContext"
        metadata:
          additionalProperties: {}
          type: object
        portfolio:
          $ref: "#/components/schemas/PortfolioContext"
        requestId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        scheme:
          description: "Payment scheme, required unless the deprecated transactionType is sent: 1 to 50 characters of A-Z, 0-9, _ or - after trimming and upper-casing."
          examples:
            - PIX
          maxLength: 50
          type: string
        segment:
          $ref: "#/components/schemas/SegmentContext"
        subType:
          description: Sub type, at most 50 bytes after trimming; stored lower-cased and matched case-insensitively.
          examples:
            - purchase
          maxLength: 50
          type: string
        transactionTimestamp:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        transactionType:
          deprecated: true
          description: "Deprecated: use scheme. Same value under its former name; when both are sent they must match."
          examples:
            - PIX
          maxLength: 50
          type: string
      required:
        - requestId
        - amount
        - asset
        - transactionTimestamp
        - account
      type: object
    ValidationReservations:
      additionalProperties: false
      properties:
        reservations:
          description: Every hold the transaction placed, ordered by limitId, scopeKey and periodKey. Empty when the validation has no transaction or the transaction held nothing.
          items:
            $ref: "#/components/schemas/Reservation"
          type: array
      required:
        - reservations
      type: object
    ValidationResponse:
      additionalProperties: false
      properties:
        decision:
          examples:
            - ALLOW
          type: string
        evaluatedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        evaluatedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        limitUsageDetails:
          description: Usage of every limit checked. Empty for a request a partner made.
          items:
            $ref: "#/components/schemas/LimitUsageDetail"
          type:
            - array
            - "null"
        matchedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        processingTimeMs:
          examples:
            - 12.5
          format: double
          type: number
        reason:
          examples:
            - Transaction denied by rule 'Block high-value checking transactions'
          type: string
        requestId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        totalRulesLoaded:
          examples:
            - 42
          format: int64
          type: integer
        truncated:
          examples:
            - false
          type: boolean
        validationId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
      required:
        - validationId
        - requestId
        - limitUsageDetails
        - processingTimeMs
        - evaluatedAt
        - decision
        - matchedRuleIds
        - evaluatedRuleIds
        - reason
        - totalRulesLoaded
        - truncated
      type: object
    ValidationSource:
      additionalProperties: false
      properties:
        accountId:
          description: Source account id; empty for the entry that groups the external legs.
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        accountType:
          examples:
            - deposit
          type: string
        amount:
          examples:
            - "100.00"
          type: string
        decision:
          examples:
            - DENY
          type: string
        exceededLimitIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        matchedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        portfolioId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
        segmentId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          type: string
      required:
        - accountId
        - amount
      type: object
    ValidationSummary:
      additionalProperties: false
      properties:
        accountId:
          format: uuid
          type: string
        amount:
          examples:
            - "100.00"
          type: string
        asset:
          examples:
            - USD
          type: string
        createdAt:
          format: date-time
          type: string
        decision:
          examples:
            - ALLOW
          type: string
        exceededLimitIds:
          description: Limits the amount exceeded. Empty for a request a partner made.
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        instructionSource:
          description: "Where the instructions came from: BINDING, or FALLBACK when at least one control used the caller's fallback mode. Absent for a record a decision did not write."
          examples:
            - FALLBACK
          type: string
        ledgerId:
          description: Midaz ledger of the transaction this reservation decided on. Absent for a validation or rules-only request, and for records written before the ledger sent it.
          format: uuid
          type: string
        matchedRuleIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        organizationId:
          description: Midaz organization of the transaction this reservation decided on. Absent for a validation or rules-only request, and for records written before the ledger sent it.
          format: uuid
          type: string
        outcome:
          description: "Effect the caller obeyed: REFUSE or PROCEED. Absent for a record a decision did not write."
          examples:
            - REFUSE
          type: string
        policies:
          description: Evaluation of every policy, per control. Absent for a record a decision did not write and for a request a partner made.
          items:
            $ref: "#/components/schemas/PolicyEvaluation"
          type:
            - array
            - "null"
        portfolioId:
          format: uuid
          type: string
        processingTimeMs:
          examples:
            - 12.5
          format: double
          type: number
        reason:
          examples:
            - All rules passed
          type: string
        scheme:
          description: Payment scheme of the validated transaction.
          examples:
            - PIX
          maxLength: 50
          type: string
        segmentId:
          format: uuid
          type: string
        sources:
          description: Outcome per source of a reserve with more than one source. Absent for any other record and for a request a partner made.
          items:
            $ref: "#/components/schemas/ValidationSource"
          type:
            - array
            - "null"
        transactionId:
          description: Ledger transaction a reservation decided on; absent for a rules-only evaluation.
          format: uuid
          type: string
        transactionType:
          description: Deprecated name of scheme; always carries the same value.
          examples:
            - PIX
          maxLength: 50
          type: string
        validationId:
          format: uuid
          type: string
      required:
        - validationId
        - decision
        - reason
        - amount
        - asset
        - transactionType
        - scheme
        - accountId
        - matchedRuleIds
        - exceededLimitIds
        - processingTimeMs
        - createdAt
      type: object
    VolumePoint:
      additionalProperties: false
      properties:
        date:
          examples:
            - "2026-09-19"
          type: string
        volume:
          examples:
            - 2740
          format: int64
          type: integer
      required:
        - date
        - volume
      type: object
  securitySchemes:
    ApiKeyAuth:
      description: Static API key presented in the X-API-Key header.
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      bearerFormat: JWT
      description: JWT bearer token issued by the identity provider.
      scheme: bearer
      type: http
info:
  contact:
    email: contact@lerian.studio
    name: Lerian Studio
    url: https://lerian.studio
  description: Reference for Midaz Tracer transaction validation, fraud rules, spending limits, and audit events.
  license:
    name: Lerian Studio General License
  title: Midaz Tracer API
  version: 4.0.0
openapi: 3.1.0
paths:
  /audit-events:
    get:
      description: Use this endpoint to list audit events with filters and cursor-based pagination. A request a partner made never lists reservation events, which sum to a limit's shared counter, and an event_type or resource_type filter asking for them answers 400 (code 0082).
      operationId: listAuditEvents
      parameters:
        - description: Start date (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC; a date-only start is 00:00:00)
          explode: false
          in: query
          name: start_date
          schema:
            description: Start date (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC; a date-only start is 00:00:00)
            type: string
        - description: End date (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC; a date-only end covers the whole day)
          explode: false
          in: query
          name: end_date
          schema:
            description: End date (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC; a date-only end covers the whole day)
            type: string
        - description: Filter by event type (TRANSACTION_VALIDATED, RULE_CREATED, RULE_UPDATED, RULE_ACTIVATED, RULE_DEACTIVATED, RULE_DRAFTED, RULE_DELETED, LIMIT_CREATED, LIMIT_UPDATED, LIMIT_DELETED, LIMIT_ACTIVATED, LIMIT_DEACTIVATED, LIMIT_DRAFTED, RESERVATION_RESERVED, RESERVATION_CONFIRMED, RESERVATION_RELEASED, RESERVATION_EXPIRED, RESERVATION_SKIPPED)
          explode: false
          in: query
          name: event_type
          schema:
            description: Filter by event type (TRANSACTION_VALIDATED, RULE_CREATED, RULE_UPDATED, RULE_ACTIVATED, RULE_DEACTIVATED, RULE_DRAFTED, RULE_DELETED, LIMIT_CREATED, LIMIT_UPDATED, LIMIT_DELETED, LIMIT_ACTIVATED, LIMIT_DEACTIVATED, LIMIT_DRAFTED, RESERVATION_RESERVED, RESERVATION_CONFIRMED, RESERVATION_RELEASED, RESERVATION_EXPIRED, RESERVATION_SKIPPED)
            type: string
        - description: Filter by action (VALIDATE, CREATE, UPDATE, DELETE, ACTIVATE, DEACTIVATE, DRAFT, RESERVE, CONFIRM, RELEASE, EXPIRE, SKIP)
          explode: false
          in: query
          name: action
          schema:
            description: Filter by action (VALIDATE, CREATE, UPDATE, DELETE, ACTIVATE, DEACTIVATE, DRAFT, RESERVE, CONFIRM, RELEASE, EXPIRE, SKIP)
            type: string
        - description: Filter by result (SUCCESS, FAILED, ALLOW, DENY, REVIEW)
          explode: false
          in: query
          name: result
          schema:
            description: Filter by result (SUCCESS, FAILED, ALLOW, DENY, REVIEW)
            type: string
        - description: Filter by resource type (transaction, rule, limit, reservation)
          explode: false
          in: query
          name: resource_type
          schema:
            description: Filter by resource type (transaction, rule, limit, reservation)
            type: string
        - description: Filter by resource ID (UUID)
          explode: false
          in: query
          name: resource_id
          schema:
            description: Filter by resource ID (UUID)
            type: string
        - description: Filter by actor type (user, api_key, system)
          explode: false
          in: query
          name: actor_type
          schema:
            description: Filter by actor type (user, api_key, system)
            type: string
        - description: Filter by actor ID
          explode: false
          in: query
          name: actor_id
          schema:
            description: Filter by actor ID
            type: string
        - description: Filter by account ID (UUID)
          explode: false
          in: query
          name: account_id
          schema:
            description: Filter by account ID (UUID)
            type: string
        - description: Filter by segment ID (UUID)
          explode: false
          in: query
          name: segment_id
          schema:
            description: Filter by segment ID (UUID)
            type: string
        - description: Filter by portfolio ID (UUID)
          explode: false
          in: query
          name: portfolio_id
          schema:
            description: Filter by portfolio ID (UUID)
            type: string
        - description: "Deprecated: use scheme. Same filter under its former name; when both are sent they must carry the same value"
          explode: false
          in: query
          name: transaction_type
          schema:
            deprecated: true
            description: "Deprecated: use scheme. Same filter under its former name; when both are sent they must carry the same value"
            type: string
        - description: "Filter by payment scheme: 1 to 50 characters of A-Z, 0-9, _ or -, trimmed and upper-cased before matching"
          explode: false
          in: query
          name: scheme
          schema:
            description: "Filter by payment scheme: 1 to 50 characters of A-Z, 0-9, _ or -, trimmed and upper-cased before matching"
            type: string
        - description: Filter by matched rule ID (UUID)
          explode: false
          in: query
          name: matched_rule_id
          schema:
            description: Filter by matched rule ID (UUID)
            type: string
        - description: "Max items per page (1-1000, default: 100)"
          explode: false
          in: query
          name: limit
          schema:
            description: "Max items per page (1-1000, default: 100)"
            type: string
        - description: Pagination token (empty for first page)
          explode: false
          in: query
          name: cursor
          schema:
            description: Pagination token (empty for first page)
            type: string
        - description: Sort field (created_at, event_type)
          explode: false
          in: query
          name: sort_by
          schema:
            description: Sort field (created_at, event_type)
            type: string
        - description: Sort direction (ASC, DESC)
          explode: false
          in: query
          name: sort_order
          schema:
            description: Sort direction (ASC, DESC)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListAuditEventsResponse"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid credentials. API-key mode (or a bearer token without sub) answers application/json; an Access Manager refusal under plugin auth answers application/problem+json.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: List audit events
      tags:
        - Audit
  /audit-events/{audit_event_id}:
    get:
      description: Use this endpoint to retrieve a single audit event by its unique identifier. A reservation event answers a request a partner made 404, as for an unknown event.
      operationId: getAuditEvent
      parameters:
        - description: Audit event ID (UUID)
          in: path
          name: audit_event_id
          required: true
          schema:
            description: Audit event ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEvent"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid credentials. API-key mode (or a bearer token without sub) answers application/json; an Access Manager refusal under plugin auth answers application/problem+json.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Get an audit event by ID
      tags:
        - Audit
  /audit-events/{audit_event_id}/verify:
    get:
      description: Verifies the event's place in the hash chain. An event written after the linker cutover is linked within seconds; until then the answer is 409 (code 0566, retry), never isValid=false.
      operationId: verifyAuditEvent
      parameters:
        - description: Audit event ID (UUID)
          in: path
          name: audit_event_id
          required: true
          schema:
            description: Audit event ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HashChainVerificationResult"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedError"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Missing or invalid credentials. API-key mode (or a bearer token without sub) answers application/json; an Access Manager refusal under plugin auth answers application/problem+json.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Verify audit event hash chain integrity
      tags:
        - Audit
  /dashboard/fraud-types:
    get:
      description: "Returns DENY + REVIEW decisions broken down by payment scheme, with each scheme's share of the flagged traffic: the ten schemes that flag most, plus one OTHER slice summing the rest."
      operationId: getDashboardFraudTypes
      parameters:
        - description: "Relative window: 7d, 30d or 90d (default: 30d). Mutually exclusive with start_date/end_date."
          explode: false
          in: query
          name: period
          schema:
            description: "Relative window: 7d, 30d or 90d (default: 30d). Mutually exclusive with start_date/end_date."
            type: string
        - description: Window start (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC, inclusive). Requires end_date. Mutually exclusive with period.
          explode: false
          in: query
          name: start_date
          schema:
            description: Window start (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC, inclusive). Requires end_date. Mutually exclusive with period.
            type: string
        - description: Window end (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC). 00:00:00 or 23:59:59 covers that whole day in its own offset; any other end is inclusive. Requires start_date. The window may not exceed 90 days.
          explode: false
          in: query
          name: end_date
          schema:
            description: Window end (RFC3339, or yyyy-mm-dd / yyyy-mm-dd hh:mm:ss in UTC). 00:00:00 or 23:59:59 covers that whole day in its own offset; any other end is inclusive. Requires start_date. The window may not exceed 90 days.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFraudTypes"
          description: OK
