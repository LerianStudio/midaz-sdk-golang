      description: "A revert whose pending fees have not finished being recorded is refused with 409 (0529); nothing moves, and a later retry may succeed. A revert of a transaction dated before the start of the archive window is refused with 422 (0562). The archive window exists only where the history archive is enabled. In a cross-ledger group, one member dated before the window start refuses the whole group. On the PostgreSQL engine a request the ledger cannot take in time answers 503 (0576) with Retry-After before any work: nothing was applied, so send it again after that interval."
      operationId: revertTransactionV2
      parameters:
        - description: Organization ID (UUID)
          in: path
          name: organization_id
          required: true
          schema:
            description: Organization ID (UUID)
            type: string
        - description: Ledger ID (UUID)
          in: path
          name: ledger_id
          required: true
          schema:
            description: Ledger ID (UUID)
            type: string
        - description: Transaction ID (UUID)
          in: path
          name: transaction_id
          required: true
          schema:
            description: Transaction ID (UUID)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LifecycleV2Input"
      responses:
        "201":
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TransactionV2"
                  - $ref: "#/components/schemas/CrossLedgerTransactionGroupV2"
          description: Created
          headers:
            X-Idempotency-Replayed:
              schema:
                type: string
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
      summary: Revert a Transaction (v2)
      tags:
        - Transactions (v2)
