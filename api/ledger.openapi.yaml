    AtomicTransactionBatchV2Transaction:
      additionalProperties: false
      properties:
        accountPlanFees:
          deprecated: true
          description: "Account plan outcome of each source account of the transaction with an active account plan assignment, followed by each destination account whose plan has a received fee matching the transaction: the matched fee, whether the unit was free (quota), charged or matched no fee (no_match, source accounts only), its ordinal in the period and the fee charged. A received fee is deducted from what the destination account receives. Absent when no account was decided, and on every response other than a create. Deprecated: the fees list answers the same per fee; this field is still returned as described here."
          items:
            $ref: "#/components/schemas/FeeAccountPlanFeeOutcome"
          type:
            - array
            - "null"
        amount:
          examples:
            - "1500"
          minimum: 0
          type:
            - string
            - "null"
        assetCode:
          examples:
            - BRL
          maxLength: 10
          minLength: 2
          type: string
        createdAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
        createdBy:
          description: "The authenticated caller that created the transaction: a person's user id, or an application's client id; absent when the ledger does not record creators."
          examples:
            - 7f2c1e4a-0b1d-4c8e-9a53-2d6e5f1a9b30
          type: string
        credit:
          examples:
            - - "@person2"
          items:
            type: string
          type:
            - array
            - "null"
        debit:
          examples:
            - - "@person1"
          items:
            type: string
          type:
            - array
            - "null"
        deletedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type:
            - string
            - "null"
        description:
          examples:
            - Transaction description
          maxLength: 256
          type: string
        fees:
          $ref: "#/components/schemas/TransactionFeesV2"
          description: "Fees the create evaluated for this transaction, one item per fee in the order they were evaluated: only its own, never those of the other transactions of the batch or group. Present on every atomic batch and cross-ledger create; absent on the commit, cancel and revert responses."
        feesSkipped:
          examples:
            - false
          type: boolean
        groupId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        id:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        ledgerId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          description: "Additional custom attributes. The ledger writes seven fee keys on this field itself and reserves them: feeApplied is the string true when the fee engine actually charged this transaction; packageAppliedID is the identifier of the fee package the engine applied, written when that package charged a fee or recorded an exemption (including a package that priced the transaction at zero), and absent when no package applied, which includes a route whose packages all exclude the amount by their bounds, or when the applied package's fees only rounded down to zero; feeDeductedAmount is the decimal total the fees deducted from the transferred amount, written only when a deductible fee took part of it, so a caller reading a hold learns the destination receives less than requested without reading the fee package; feeExemption is a string holding a JSON object with exempt, reason and message, present when every account on one side of the transaction is exempt from fees, which is how a caller tells an exemption apart from no package having matched; feeExemption is also present, with reason cross_ledger_bridge, when the only account on one side that would have paid a fee is the @external/<asset> bridge closing a part of a cross-ledger group, because that bridge never pays a fee; feeExemption is also present, with reason zero_fee_amount, when the package priced the transaction at zero, for instance a band configured with no fee, so no fee leg was posted and feeApplied is absent; a transaction recorded before v4.1.1 stored feeExemption as that object itself, and a read returns it as the string too; feeDebtOpenings and feeDebtSettlements are strings holding a JSON array, in the order the ledger applied them, of the fee debts this transaction opened because its payer could not fund a deferrable fee (debtId, debtorRef, creditRef, opened, seq) and of the fee debts it settled (debtId, debtorRef, creditRef, amount, opened, seq), each absent when there is none; feeDebtCollection is the string true on a standalone fee-debt collection, whose amount is what it settled and which cannot be reverted; billingChargeId, on the fee transaction of a billing maintenance charge, is the id of the durable charge record that posted it; feeChargeId, on the fee transaction of a service fee charge, is the id of the charge that posted it; feeDebtOriginId, on the transaction that gives back to its debtor what a later credit paid of the fee debts of a charge recorded without a transaction, written when that charge is canceled, is the id of the execution that opened those debts, which no transaction carries, and such a transaction cannot be reverted. feeApplied, packageAppliedID and feeExemption are deprecated: the fees list answers the same per fee, with what each fee amounted to and why an exempt one charged nothing; they are still written and returned as described here. A request body carrying feeApplied, packageAppliedID, feeDeductedAmount, feeExemption, feeDebtOpenings, feeDebtSettlements, feeDebtCollection, billingChargeId, feeChargeId, feeDebtOriginId or feeDeferPair is refused with 400 naming the offending key, on every body that carries transaction metadata: a create, a metadata update and a fee estimate. A metadata update, including one that clears the metadata, never changes them. So a value present here is always the ledger's own word about the charge and never one a caller supplied. feeLeg and feeDeferPair, on operation metadata, are reserved the same way. Transaction-level metadata is additive, so caller-supplied keys on this field are preserved alongside the ledger keys."
          type: object
        operations:
          items:
            $ref: "#/components/schemas/OperationV2"
          type:
            - array
            - "null"
        order:
          description: Logical order used to execute this transaction.
          format: int64
          minimum: 1
          type: integer
        organizationId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        parentTransactionId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        routeId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        scheme:
