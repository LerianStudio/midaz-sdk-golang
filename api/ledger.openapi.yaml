      summary: Get ledger dashboard metrics
      tags:
        - Dashboard (v2)
  /v2/organizations/{organization_id}/ledgers/{ledger_id}/dashboard/volume:
    get:
      description: Returns one point per UTC calendar day the window TOUCHES, including days with no transactions, which are present with transactions 0 and an empty byAsset. A window is half-open and snaps to the minute rather than to midnight, so a 7d window opened mid-afternoon returns EIGHT points. Each point's transactions counts every status; its byAsset applies the same settled rule as /metrics. Summing the points reproduces /metrics exactly, and is likewise GROSS of reversals.
