            type: string
        - description: "Idempotency slot TTL in seconds: default 300, at most 604800 (a larger value is capped); a missing, malformed or non-positive value falls back to 300 without an error. Within X-TTL a repeat of an approved request returns its first outcome; a request refused by validation keeps nothing, so its repeat runs again; a failed persistence (0095) keeps the key for at least 24 hours (longer when X-TTL is longer); after X-TTL a repeat of an approved request posts again"
