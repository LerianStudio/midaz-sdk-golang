  /v2/organizations/{organization_id}/ledgers/{ledger_id}/estimates:
    post:
      description: "Prices the transaction in the body against the fee package it names, without posting or recording anything. The 200 body carries message, feesApplied and fees. feesApplied is the transaction with the fee legs the package would add, or null when no package rule applied, including when every account on one side is exempt from fees. fees is always present and holds items alone: one item per fee of the package the engine evaluated, in evaluation order, empty when it evaluated none, such as when the package bounds exclude the amount. Each item has feeKey, label, source (always package, since an estimate does not evaluate account plans), assetCode, amount (0 when exempt), deductible, outcome (charged or exempt), reason (only when exempt: all_source_accounts_exempt, all_destination_accounts_exempt, all_accounts_exempt, cross_ledger_bridge or zero_fee_amount) and packageId. An estimate item never carries collected, deferred or feeDebtIds, which only a direct create knows, and fees has no transactionId, recorded or available, since an estimate records no list."
