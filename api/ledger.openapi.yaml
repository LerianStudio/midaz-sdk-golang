paths:
  /v1/organizations:
    get:
      deprecated: true
      operationId: listOrganizations
      parameters:
        - description: Filter organizations by metadata with one or more metadata.<key>=<value> parameters; a bare metadata parameter is ignored
          explode: false
          in: query
          name: metadata
          schema:
            description: Filter organizations by metadata with one or more metadata.<key>=<value> parameters; a bare metadata parameter is ignored
            type: string
        - description: Max items per page (1-100, default 10)
          explode: false
          in: query
          name: limit
          schema:
            description: Max items per page (1-100, default 10)
            type: string
        - description: Page number (default 1)
          explode: false
          in: query
          name: page
          schema:
            description: Page number (default 1)
            type: string
        - description: Filter organizations created on/after this date (YYYY-MM-DD)
          explode: false
          in: query
          name: start_date
          schema:
            description: Filter organizations created on/after this date (YYYY-MM-DD)
            type: string
        - description: Filter organizations created on/before this date (YYYY-MM-DD)
          explode: false
          in: query
          name: end_date
          schema:
            description: Filter organizations created on/before this date (YYYY-MM-DD)
            type: string
        - description: Sort direction (asc, desc)
          explode: false
          in: query
          name: sort_order
          schema:
            description: Sort direction (asc, desc)
            type: string
        - description: Filter by legal name (case-insensitive, prefix match)
          explode: false
          in: query
          name: legal_name
          schema:
            description: Filter by legal name (case-insensitive, prefix match)
            type: string
        - description: Filter by doing business as name (case-insensitive, prefix match)
          explode: false
          in: query
          name: doing_business_as
          schema:
            description: Filter by doing business as name (case-insensitive, prefix match)
            type: string
        - description: Filter by status
          explode: false
          in: query
          name: status
          schema:
            description: Filter by status
            type: string
        - description: Filter by legal document (exact match)
          explode: false
          in: query
          name: legal_document
          schema:
            description: Filter by legal document (exact match)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pagination"
          description: OK
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
          description: Error
      security:
        - BearerAuth: []
      summary: List all organizations
      tags:
        - Organizations (v1)
    post:
