  /v2/transactions/batch:
    post:
      description: "Executes direct and hold transactions once, in explicit increasing order, as one all-or-none accounting decision. The response preserves that order. The decoded body must be smaller than 1 MiB; the configured cardinality is 1-50, aggregate input legs are limited to 1,000, and post-fee work is limited to 100 postings and 150 distinct balances (an account's overdraft balance counts as one). There is no batch query endpoint. On the PostgreSQL engine a create whose wait ends before it is decided answers 422 (0569) and applies nothing; one whose outcome cannot be read after it was published answers 503 (0570): resend it with the same idempotency key. A create the ledger cannot take in time answers 503 (0576) with Retry-After before any work: nothing was applied, so send it again after that interval with the same idempotency key."
      operationId: createAtomicTransactionBatchV2
      parameters:
        - description: Idempotency key to safely retry the request. A retry after the first request completes replays its outcome; a different request under the same key, or a retry while the first request is still executing, answers 409 (0084)
          in: header
          name: X-Idempotency
          schema:
            description: Idempotency key to safely retry the request. A retry after the first request completes replays its outcome; a different request under the same key, or a retry while the first request is still executing, answers 409 (0084)
            type: string
        - description: "Idempotency slot TTL in seconds: default 300, at most 604800 (a larger value is capped); a missing, malformed or non-positive value falls back to 300 without an error. Within X-TTL a repeat of an approved request returns its first outcome; a refused request keeps nothing, so its repeat runs again; after X-TTL a repeat posts again"
          in: header
          name: X-TTL
          schema:
            description: "Idempotency slot TTL in seconds: default 300, at most 604800 (a larger value is capped); a missing, malformed or non-positive value falls back to 300 without an error. Within X-TTL a repeat of an approved request returns its first outcome; a refused request keeps nothing, so its repeat runs again; after X-TTL a repeat posts again"
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAtomicTransactionBatchV2Request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAtomicTransactionBatchV2Response"
          description: Created
          headers:
            X-Idempotency-Replayed:
              schema:
                type: string
        "413":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Request Entity Too Large
