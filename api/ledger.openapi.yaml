    UpdateTransactionRouteInputV2:
      additionalProperties: false
      properties:
        alias:
          description: "Names a transaction route that has none, under the same rules as on create. Omit it to keep the alias as it is. Once set, an alias cannot change or be removed: a different value or null is refused."
          examples:
            - pix-in
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,100}$
          type:
            - string
            - "null"
        description:
          examples:
            - Settlement route for service charges
          type: string
        metadata:
          additionalProperties: {}
          type: object
        operationRoutes:
          items:
            description: An Operation Route ID, or an object that links the operation route with an alias and its optionality.
            oneOf:
              - format: uuid
                type: string
              - $ref: "#/components/schemas/TransactionRouteLinkObjectV2"
          type:
            - array
            - "null"
        optionalOperationRoutes:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        title:
          examples:
            - Charge Settlement
          type: string
      type: object
    Upstream:
      additionalProperties: false
      properties:
        code:
          description: The upstream provider's own error code, verbatim.
          examples:
            - E4001
          type: string
        message:
          description: The upstream provider's own error message, verbatim (bounded, never its raw response body).
          examples:
            - account not found at provider
          type: string
      type: object
    V2LegInput:
      additionalProperties: false
      description: "One leg of a transaction side. Fill EXACTLY ONE value expression per leg: `amount` for an explicit value, or `share` for a percentage of the transaction total. A leg carrying both, or neither, is rejected. `balanceKey` optionally selects one of the account's balances; when omitted, the `default` balance is used."
      properties:
        alias:
          description: "The leg's account alias. Accepts letters, digits and the characters @ : _ and -, or an external account alias spelled @external/ followed by the uppercase asset code. Any other spelling is refused with 400 before the transaction is calculated."
          examples:
            - "@person1"
          type: string
        amount:
          type: string
        balanceKey:
          description: Optional balance key for this leg. When omitted, the transaction uses the account's default balance.
          examples:
            - food
          maxLength: 100
          type: string
        description:
          maxLength: 256
          type: string
        ledgerId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        metadata:
          additionalProperties: {}
          description: Optional flat key-value attributes stored on the operation this leg produces. Keys up to 100 bytes, values up to 2000 bytes, no nested objects or arrays. The fee keys the ledger reserves, such as feeLeg and feeDeferPair, are refused with 400 (code 0512).
          type: object
        operationRouteAlias:
          description: Optional alias of this leg's operation route link in the transaction route, the alternative to the leg's operationRouteId. It overrides the request-level operation route for this leg and is resolved inside the transaction route named by routeId or routeAlias, which is then required. Send operationRouteId or operationRouteAlias, not both.
          examples:
            - dst
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,100}$
          type: string
        operationRouteId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        organizationId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        share:
          $ref: "#/components/schemas/V2ShareInput"
      required:
        - alias
        - organizationId
        - ledgerId
      type: object
    V2ShareInput:
      additionalProperties: false
      properties:
