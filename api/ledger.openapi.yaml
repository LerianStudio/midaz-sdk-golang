    CreateAtomicTransactionBatchV2ItemRequest:
      additionalProperties: false
      properties:
        accountBlockExceptionId:
          description: Single-use account-block exception identifier. Authorizes one debit of an exact amount out of a blocked source account, and is consumed on use. Rejected on the hold action.
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        action:
          description: Transaction action.
          enum:
            - direct
            - hold
          type: string
        amount:
          type: string
        asset:
          type: string
        code:
          type: string
        credits:
          items:
            $ref: "#/components/schemas/V2LegInput"
          maxItems: 500
          minItems: 1
          type: array
        debits:
          items:
            $ref: "#/components/schemas/V2LegInput"
          maxItems: 500
          minItems: 1
          type: array
        description:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        operationRouteAlias:
          description: Optional alias of the operation route link in the transaction route, the alternative to operationRouteId, under the same format as routeAlias. It is resolved inside the transaction route named by routeId or routeAlias, which is then required, and legs without their own operation route inherit it. Send operationRouteId or operationRouteAlias, not both.
          examples:
            - src
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,100}$
          type: string
        operationRouteId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        order:
          description: One-based logical execution order.
          format: int64
          minimum: 1
          type: integer
        routeAlias:
          description: "Optional alias of the transaction route, the alternative to routeId: 1 to 100 letters, digits, '_' or '-', compared exactly and never shaped as a UUID. It is resolved to the route's UUID before the transaction is processed, so the transaction stores and answers routeId. Send routeId or routeAlias, not both."
          examples:
            - pix-in
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,100}$
          type: string
        routeId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        scheme:
          description: Optional payment scheme of the transaction, for example PIX, WIRE, CARD or CRYPTO. Any value of up to 50 letters, digits, underscores or hyphens is accepted; it is trimmed and upper-cased. CARD covers any card payment and is never the card brand.
          examples:
            - PIX
          maxLength: 50
          type: string
        skip:
          $ref: "#/components/schemas/TransactionSkip"
        subType:
          description: Optional subType of the transaction, for example instant or refund. Any value of up to 50 bytes is accepted; it is trimmed and lower-cased. Limits and rules scoped by a subType apply to the transaction.
          examples:
            - instant
          maxLength: 50
          type: string
      required:
        - action
        - order
        - asset
        - amount
        - debits
        - credits
      type: object
