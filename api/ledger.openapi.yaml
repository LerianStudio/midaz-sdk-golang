    CreateTransactionV2Input:
      additionalProperties: false
      description: Transaction request body. `debits` and `credits` are the two required, non-empty leg arrays of the transaction; one debit paired with many credits, or the reverse, is a valid request. Every leg names the `organizationId` and `ledgerId` its account belongs to. The direct and hold actions accept multiple enabled ledgers and return an atomic group; block and unblock still require every leg to name the same pair. `asset`, `amount`, `description`, `code`, `routeId`, `operationRouteId` and `metadata` sit alongside the two leg arrays, and `amount` is the transaction total that the legs' `share` expressions divide. Each leg array holds at most 500 legs. `routeAlias` and `operationRouteAlias` name the routes by alias instead of `routeId` and `operationRouteId`; each level takes the ID or the alias, not both.
      properties:
        accountBlockExceptionId:
          description: Single-use account-block exception identifier. Authorizes one debit of an exact amount out of a blocked source account, and is consumed on use. Rejected on the hold action.
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        amount:
          type: string
        asset:
          type: string
        code:
          type: string
        credits:
          items:
            $ref: "#/components/schemas/V2LegInput"
          maxItems: 500
          minItems: 1
          type: array
        debits:
          items:
            $ref: "#/components/schemas/V2LegInput"
          maxItems: 500
          minItems: 1
          type: array
        description:
          type: string
        metadata:
          additionalProperties: {}
          type: object
        operationRouteAlias:
          description: Optional alias of the operation route link in the transaction route, the alternative to operationRouteId, under the same format as routeAlias. It is resolved inside the transaction route named by routeId or routeAlias, which is then required, and legs without their own operation route inherit it. Send operationRouteId or operationRouteAlias, not both.
          examples:
            - src
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,100}$
          type: string
        operationRouteId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        routeAlias:
          description: "Optional alias of the transaction route, the alternative to routeId: 1 to 100 letters, digits, '_' or '-', compared exactly and never shaped as a UUID. It is resolved to the route's UUID before the transaction is processed, so the transaction stores and answers routeId. Send routeId or routeAlias, not both."
          examples:
            - pix-in
          maxLength: 100
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]{1,100}$
          type: string
        routeId:
          examples:
            - 00000000-0000-0000-0000-000000000000
          format: uuid
          type: string
        scheme:
          description: Optional payment scheme of the transaction, for example PIX, WIRE, CARD or CRYPTO. Any value of up to 50 letters, digits, underscores or hyphens is accepted; it is trimmed and upper-cased. CARD covers any card payment and is never the card brand.
          examples:
            - PIX
          maxLength: 50
          type: string
        skip:
          $ref: "#/components/schemas/TransactionSkip"
        subType:
          description: Optional subType of the transaction, for example instant or refund. Any value of up to 50 bytes is accepted; it is trimmed and lower-cased. Limits and rules scoped by a subType apply to the transaction.
          examples:
            - instant
          maxLength: 50
          type: string
      required:
        - asset
        - amount
        - debits
        - credits
      type: object
    CreatedTransactionV2:
      additionalProperties: false
      properties:
        accountPlanFees:
          deprecated: true
          description: "Account plan outcome of each source account of the transaction with an active account plan assignment, followed by each destination account whose plan has a received fee matching the transaction: the matched fee, whether the unit was free (quota), charged or matched no fee (no_match, source accounts only), its ordinal in the period and the fee charged. A received fee is deducted from what the destination account receives. Absent when no account was decided. Deprecated: the fees list answers the same per fee; this field is still returned as described here."
          items:
            $ref: "#/components/schemas/FeeAccountPlanFeeOutcome"
          type:
