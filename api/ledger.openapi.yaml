        subType:
          description: SubType the transaction declared, normalized to lower case; absent when none.
          examples:
            - instant
          maxLength: 50
          type: string
        tracerSkipped:
          examples:
            - false
          type: boolean
        updatedAt:
          examples:
            - "2021-01-01T00:00:00Z"
          format: date-time
          type: string
      required:
        - order
        - id
        - description
        - status
        - amount
        - assetCode
        - debit
        - credit
        - ledgerId
        - organizationId
        - feesSkipped
        - tracerSkipped
        - createdAt
        - updatedAt
        - deletedAt
        - operations
      type: object
