          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
          description: Created
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
          description: Internal Server Error
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LegacyError"
          description: Error
      security:
        - BearerAuth: []
      summary: Create a new organization
      tags:
        - Organizations (v1)
