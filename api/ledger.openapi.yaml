            type: string
        - description: "Idempotency key to safely retry the request. A retry after the first request completes replays its outcome; a different request under the same key, or a retry while the first request is still executing, answers 409 (0084). After a 500 (0095) or 504 (0564) repeat the request with the same key and the same body within 24 hours: 0095 again while the annotation is still pending, 201 with X-Idempotency-Replayed true once it is persisted"
