# Local fragment of the Tracer spec: the five HTTP reservation operations and
# their three response schemas.
#
# Origin: copied verbatim from api/tracer.openapi.yaml as vendored from Midaz
# b6506518f (v4.1.3), components/tracer/api/openapi.huma.yaml.
#
# Reason: Tracer serves these routes up to 4.1.x; from 4.2.0 they answer 404
# and the v4.6.0 spec no longer declares them. The Reservations facade is part
# of the SDK 6.x public contract and still serves Tracer 4.1.x, so its client
# operations must keep being generated.
#
# How it is used: scripts/generate-clients.sh merges this file into the Tracer
# spec with internal/cmd/specoverlay before code generation. The merge only
# appends; a path or schema the server spec already declares stops the
# generation.
#
# Removal: delete this file and its entry in scripts/generate-clients.sh when
# the SDK retires the Reservations facade.
paths:
  /reservations:
    post:
      operationId: createReservation
      requestBody:
        content:
          application/json:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReserveResponse"
          description: Created
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Reserve transaction capacity (phase one)
      tags:
        - Reservations
  /reservations/transaction/{transaction_id}/confirm:
    post:
      operationId: confirmReservationByTransaction
      parameters:
        - description: Transaction ID (UUID)
          in: path
          name: transaction_id
          required: true
          schema:
            description: Transaction ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionActionResponse"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Confirm a transaction's reservations (phase two — commit by transaction)
      tags:
        - Reservations
  /reservations/transaction/{transaction_id}/release:
    post:
      operationId: releaseReservationByTransaction
      parameters:
        - description: Transaction ID (UUID)
          in: path
          name: transaction_id
          required: true
          schema:
            description: Transaction ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionActionResponse"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Release a transaction's reservations (phase two — abort by transaction)
      tags:
        - Reservations
  /reservations/{id}/confirm:
    post:
      operationId: confirmReservation
      parameters:
        - description: Reservation ID (UUID)
          in: path
          name: id
          required: true
          schema:
            description: Reservation ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationActionResponse"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Confirm a reservation (phase two — commit)
      tags:
        - Reservations
  /reservations/{id}/release:
    post:
      operationId: releaseReservation
      parameters:
        - description: Reservation ID (UUID)
          in: path
          name: id
          required: true
          schema:
            description: Reservation ID (UUID)
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReservationActionResponse"
          description: OK
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      security:
        - BearerAuth: []
        - ApiKeyAuth: []
      summary: Release a reservation (phase two — abort)
      tags:
        - Reservations
components:
  schemas:
    ReservationActionResponse:
      additionalProperties: false
      properties:
        reservationId:
          format: uuid
          type: string
        status:
          examples:
            - CONFIRMED
          type: string
      required:
        - reservationId
        - status
      type: object
    ReserveResponse:
      additionalProperties: false
      properties:
        denied:
          examples:
            - false
          type: boolean
        reservationIds:
          items:
            format: uuid
            type: string
          type:
            - array
            - "null"
        transactionId:
          format: uuid
          type: string
      required:
        - transactionId
        - denied
        - reservationIds
      type: object
    TransactionActionResponse:
      additionalProperties: false
      properties:
        flipped:
          examples:
            - 2
          format: int64
          type: integer
        status:
          examples:
            - CONFIRMED
          type: string
        transactionId:
          format: uuid
          type: string
      required:
        - transactionId
        - status
        - flipped
      type: object
